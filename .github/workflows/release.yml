name: Build Orol APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - run: |
          mkdir -p app/src/main/java/uz/orol/island app/src/main/res/values app/src/main/res/drawable
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OrolIsland"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "uz.orol.island"
              compileSdk = 34
              defaultConfig {
                  applicationId = "uz.orol.island"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0-iOS"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.dynamicanimation:dynamicanimation:1.0.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:label="Orol Island iOS" android:theme="@style/Theme.OrolIsland">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".IslandService" android:enabled="true" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="iOS Dynamic Island Overlay" />
                  </service>
                  <service android:name=".NotifListener" android:exported="true" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.OrolIsland" parent="Theme.Material3.Dark.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_island_notif.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/java/uz/orol/island/Bus.kt
          package uz.orol.island
          import kotlinx.coroutines.flow.MutableSharedFlow
          import kotlinx.coroutines.flow.asSharedFlow
          sealed class IslandEvent {
              data class NotificationArrived(val title: String, val text: String, val packageName: String, val isMedia: Boolean = false) : IslandEvent()
              object Collapse : IslandEvent()
              object Expand : IslandEvent()
          }
          object Bus {
              private val _events = MutableSharedFlow<IslandEvent>(extraBufferCapacity = 32)
              val events = _events.asSharedFlow()
              fun emit(event: IslandEvent) { _events.tryEmit(event) }
          }
          EOF

          cat << 'EOF' > app/src/main/java/uz/orol/island/OrbView.kt
          package uz.orol.island
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.sin
          class OrbView @JvmOverloads constructor(context: Context, attrs: AttributeSet? = null) : View(context, attrs) {
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var phase = 0f
              private var scale = 1f
              private val anim = ValueAnimator.ofFloat(0f, (2 * Math.PI).toFloat()).apply {
                  duration = 3000L
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener {
                      phase = it.animatedValue as Float
                      scale = 0.92f + 0.08f * sin(phase * 2f)
                      invalidate()
                  }
              }
              override fun onAttachedToWindow() { super.onAttachedToWindow(); anim.start() }
              override fun onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow() }
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val cx = width / 2f; val cy = height / 2f
                  val r = (minOf(width, height) / 2f) * 0.8f * scale
                  if (r <= 0f) return
                  val m = Matrix().apply { setRotate(Math.toDegrees(phase.toDouble()).toFloat(), cx, cy) }
                  paint.shader = SweepGradient(cx, cy, intArrayOf(Color.CYAN, Color.MAGENTA, Color.BLUE, Color.CYAN), null).apply { setLocalMatrix(m) }
                  canvas.drawCircle(cx, cy, r, paint)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/uz/orol/island/IconView.kt
          package uz.orol.island
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.AccelerateDecelerateInterpolator
          import kotlin.math.sin
          class IconView @JvmOverloads constructor(context: Context, attrs: AttributeSet? = null) : View(context, attrs) {
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.CYAN }
              private val rect = RectF()
              private var tick = 0f
              private val anim = ValueAnimator.ofFloat(0f, (2 * Math.PI).toFloat()).apply {
                  duration = 1000L
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = AccelerateDecelerateInterpolator()
                  addUpdateListener { tick = it.animatedValue as Float; invalidate() }
              }
              override fun onAttachedToWindow() { super.onAttachedToWindow(); anim.start() }
              override fun onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow() }
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val bars = 4; val gap = width * 0.1f; val bw = (width - gap * (bars + 1)) / bars
                  val cy = height / 2f
                  for (i in 0 until bars) {
                      val h = height * (0.25f + 0.55f * (0.5f + 0.5f * sin(tick + i)))
                      rect.set(gap + i * (bw + gap), cy - h / 2f, gap + i * (bw + gap) + bw, cy + h / 2f)
                      canvas.drawRoundRect(rect, bw / 2f, bw / 2f, paint)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/uz/orol/island/NotifListener.kt
          package uz.orol.island
          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          class NotifListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  val notif = sbn?.notification ?: return
                  if (sbn.packageName == packageName) return
                  val extras = notif.extras ?: return
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString().orEmpty()
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString().orEmpty()
                  if (title.isBlank() && text.isBlank()) return
                  Bus.emit(IslandEvent.NotificationArrived(title, text, sbn.packageName))
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/uz/orol/island/IslandService.kt
          package uz.orol.island
          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.util.TypedValue
          import android.view.*
          import android.view.animation.OvershootInterpolator
          import android.widget.*
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          class IslandService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var root: FrameLayout
              private lateinit var pill: LinearLayout
              private lateinit var titleTv: TextView
              private lateinit var subTv: TextView
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)
              private var job: Job? = null
              private var expanded = false
              private val bg = GradientDrawable().apply {
                  setColor(Color.parseColor("#F5050507"))
                  setStroke(2, Color.parseColor("#33FFFFFF"))
              }
              override fun onCreate() {
                  super.onCreate()
                  val chId = "orol_island"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getSystemService(NotificationManager::class.java).createNotificationChannel(
                          NotificationChannel(chId, "Orol Island", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val notif = NotificationCompat.Builder(this, chId)
                      .setContentTitle("Orol Island iOS")
                      .setContentText("Ishlamoqda")
                      .setSmallIcon(R.drawable.ic_island_notif)
                      .build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(101, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(101, notif)
                  }
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  buildView()
                  scope.launch {
                      Bus.events.collect { ev ->
                          if (ev is IslandEvent.NotificationArrived) {
                              titleTv.text = ev.title.ifBlank { "Bildirishnoma" }
                              subTv.text = ev.text
                              animateIsland(true)
                          }
                      }
                  }
              }
              @SuppressLint("ClickableViewAccessibility")
              private fun buildView() {
                  root = FrameLayout(this)
                  val orb = OrbView(this)
                  val wave = IconView(this)
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; visibility = View.GONE; setPadding(dp(10), 0, dp(10), 0) }
                  titleTv = TextView(this).apply { setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 13.5f); paint.isFakeBoldText = true; maxLines = 1 }
                  subTv = TextView(this).apply { setTextColor(Color.parseColor("#B3FFFFFF")); setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f); maxLines = 2 }
                  col.addView(titleTv); col.addView(subTv)
                  pill = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; background = bg; elevation = dp(12).toFloat()
                      setPadding(dp(10), dp(6), dp(10), dp(6))
                      addView(orb, LinearLayout.LayoutParams(dp(24), dp(24)))
                      addView(col, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      addView(wave, LinearLayout.LayoutParams(dp(24), dp(18)))
                      setOnClickListener { animateIsland(!expanded) }
                  }
                  bg.cornerRadius = dp(18).toFloat()
                  root.addView(pill, FrameLayout.LayoutParams(dp(136), dp(36), Gravity.CENTER_HORIZONTAL))
                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                  val lp = WindowManager.LayoutParams(dp(360), dp(120), type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; y = dp(10)
                  }
                  wm.addView(root, lp)
              }
              private fun animateIsland(exp: Boolean) {
                  expanded = exp
                  job?.cancel()
                  val col = pill.getChildAt(1)
                  val orb = pill.getChildAt(0)
                  val targetW = if (exp) dp(336) else dp(136)
                  val targetH = if (exp) dp(78) else dp(36)
                  val orbSz = if (exp) dp(42) else dp(24)
                  orb.layoutParams = (orb.layoutParams as LinearLayout.LayoutParams).apply { width = orbSz; height = orbSz }
                  col.visibility = if (exp) View.VISIBLE else View.GONE
                  val startW = pill.layoutParams.width; val startH = pill.layoutParams.height
                  android.animation.ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 360L
                      interpolator = OvershootInterpolator(1.1f)
                      addUpdateListener { a ->
                          val f = a.animatedValue as Float
                          pill.layoutParams = (pill.layoutParams as FrameLayout.LayoutParams).apply {
                              width = (startW + (targetW - startW) * f).toInt()
                              height = (startH + (targetH - startH) * f).toInt()
                              gravity = Gravity.CENTER_HORIZONTAL
                          }
                          bg.cornerRadius = if (exp) dp(28).toFloat() else (pill.layoutParams.height / 2f)
                          pill.requestLayout()
                      }
                  }.start()
                  if (exp) {
                      job = scope.launch { delay(4500L); animateIsland(false) }
                  }
              }
              private fun dp(v: Int) = TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics).toInt()
              override fun onDestroy() { job?.cancel(); scope.cancel(); if (::root.isInitialized) wm.removeView(root); super.onDestroy() }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat << 'EOF' > app/src/main/java/uz/orol/island/MainActivity.kt
          package uz.orol.island
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL
                      setBackgroundColor(Color.BLACK); setPadding(dp(22), dp(48), dp(22), dp(24))
                  }
                  root.addView(OrbView(this), LinearLayout.LayoutParams(dp(84), dp(84)))
                  root.addView(TextView(this).apply {
                      text = "Orol Island • iOS"; setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 26f); paint.isFakeBoldText = true; setPadding(0, dp(16), 0, dp(24))
                  })
                  root.addView(btn("1. Overlay ruxsati", "#1C1C1E") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })
                  root.addView(btn("2. Bildirishnoma ruxsati", "#1C1C1E") {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  })
                  root.addView(btn("3. Islandni yoqish", "#0A84FF") {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else {
                          ContextCompat.startForegroundService(this, Intent(this, IslandService::class.java))
                      }
                  })
                  root.addView(btn("4. Sinov animatsiya", "#30D158") {
                      Bus.emit(IslandEvent.NotificationArrived("Apple Music", "iOS Dynamic Island sinovi", packageName))
                  })
                  setContentView(root)
              }
              private fun btn(t: String, c: String, click: () -> Unit) = Button(this).apply {
                  text = t; isAllCaps = false; setTextColor(Color.WHITE)
                  background = GradientDrawable().apply { setColor(Color.parseColor(c)); cornerRadius = dp(16).toFloat() }
                  layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(12) }
                  setOnClickListener { click() }
              }
              private fun dp(v: Int) = TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics).toInt()
          }
          EOF

          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Orol-Island-iOS-APK
          path: app/build/outputs/apk/debug/*.apk
